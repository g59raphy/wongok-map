<style>
:root{
  --bg:#f7f6f3; --panel:#ffffff; --text:#1d1d1f; --muted:#6b6b70; --line:#e6e4df;
  --accent:#e4572e; --chip:#f0eee9; --shadow:0 2px 12px rgba(0,0,0,.12);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141416; --panel:#1e1e21; --text:#ededee; --muted:#9a9aa0; --line:#2e2e33;
         --accent:#ff7a52; --chip:#2a2a2e; --shadow:0 2px 12px rgba(0,0,0,.45); color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
#app{display:flex;height:100%}
#side{width:380px;max-width:100%;display:flex;flex-direction:column;background:var(--panel);
  border-right:1px solid var(--line);z-index:5}
header{padding:18px max(18px, env(safe-area-inset-left)) 10px}
h1{margin:0;font-size:20px;letter-spacing:-.3px}
h1 span{color:var(--accent)}
.sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.controls{padding:0 18px 12px;border-bottom:1px solid var(--line)}
#q{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;
  background:var(--bg);color:var(--text);outline:none}
#q:focus{border-color:var(--accent)}
.label{font-size:11px;color:var(--muted);margin:10px 0 6px;font-weight:600;letter-spacing:.3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid transparent;background:var(--chip);color:var(--text);border-radius:999px;
  padding:5px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:inherit}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.on{background:var(--text);color:var(--panel)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12.5px;color:var(--muted)}
select{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:4px 6px;font-size:12.5px}
#list{flex:1;overflow:auto;padding:6px 10px 20px}
.item{padding:12px 10px;border-radius:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.item:hover,.item.active{background:var(--chip)}
.badge{flex:none;width:34px;height:34px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;
  display:flex;align-items:center;justify-content:center}
.item h3{margin:0;font-size:15px}
.meta{font-size:12px;color:var(--muted);margin-top:3px}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
#mapwrap{flex:1;position:relative}
#map{position:absolute;inset:0}
#notice{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
  background:var(--bg);text-align:center;line-height:1.6;font-size:14px;color:var(--muted);z-index:2}
#notice b{color:var(--text)}
#notice[hidden]{display:none}
/* 지도 마커 */
.pin{border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);color:#fff;cursor:pointer;
  font-weight:700;display:flex;align-items:center;justify-content:center;font-size:11px;transition:transform .12s}
.pin:hover,.pin.sel{transform:scale(1.2)}
/* 지도 위 정보 카드 */
.card{position:relative;width:280px;max-width:80vw;background:var(--panel);color:var(--text);border-radius:14px;
  box-shadow:var(--shadow);padding:14px 16px;margin-bottom:22px;font-size:13px;white-space:normal}
.card:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;
  border-bottom:0;border-top-color:var(--panel)}
.card h3{margin:0 24px 2px 0;font-size:16px}
.card .x{position:absolute;top:8px;right:10px;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer}
.card ul{margin:8px 0 0;padding:0;list-style:none;max-height:170px;overflow:auto}
.card li{line-height:1.45;padding:6px 0;border-top:1px dashed var(--line)}
.card li b{color:var(--accent)}
.links{display:flex;gap:6px;margin-top:10px}
.links a{flex:1;text-align:center;font-size:12.5px;padding:7px 0;border-radius:8px;text-decoration:none;
  background:var(--chip);color:var(--text);font-weight:600}
.links a.kakao{background:#fee500;color:#191919}
#toggle{display:none}
@media (max-width:760px){
  #app{flex-direction:column-reverse}
  #side{width:100%;height:46%;border-right:0;border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;box-shadow:var(--shadow);transition:height .2s}
  #side.min{height:150px}
  #toggle{display:block;margin:8px auto 0;width:40px;height:5px;border-radius:3px;background:var(--line);border:0;cursor:pointer}
  header{padding:8px 16px 6px}
  .controls{padding:0 16px 10px}
  .card{width:250px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <button id="toggle" aria-label="목록 접기/펼치기"></button>
    <header>
      <h1>원곡고 <span>맛집지도</span></h1>
      <p class="sub">학생들이 직접 추천한 학교 주변 맛집 <b id="total"></b>곳</p>
    </header>
    <div class="controls">
      <input id="q" type="search" placeholder="가게 이름, 메뉴, 추천 이유 검색">
      <div class="label">분류</div>
      <div class="chips" id="cats"></div>
      <div class="label">추천한 반</div>
      <div class="chips" id="classes"></div>
      <div class="row">
        <span id="count"></span>
        <select id="sort">
          <option value="count">추천 많은 순</option>
          <option value="name">이름순</option>
        </select>
      </div>
    </div>
    <div id="list"></div>
  </aside>
  <div id="mapwrap">
    <div id="map"></div>
    <div id="notice" hidden></div>
  </div>
</div>

const esc = s => String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

// 같은 좌표에 여러 가게가 있으면 살짝 펼쳐서 겹치지 않게
const groups = {};
DATA.forEach((d,i) => { d.id = i; d.plat = d.lat; d.plng = d.lng; const k = d.lat+","+d.lng; (groups[k] ||= []).push(d); });
Object.values(groups).forEach(g => { if (g.length < 2) return;
  g.forEach((d,j) => { const a = 2*Math.PI*j/g.length; d.plat = d.lat + 0.00012*Math.sin(a); d.plng = d.lng + 0.00015*Math.cos(a); }); });

// ---------- 목록 / 필터 (지도와 상관없이 항상 동작) ----------
const state = { q:"", cats:new Set(), classes:new Set(), sort:"count" };
const cats = [...new Set(DATA.map(d => d.cat))].sort((a,b) => Object.keys(COLORS).indexOf(a) - Object.keys(COLORS).indexOf(b));
const classes = [...new Set(DATA.flatMap(d => d.classes))].sort((a,b) => parseInt(a)-parseInt(b));

function chips(el, items, set, dot){
  el.innerHTML = `<button class="chip on" data-v="">전체</button>` +
    items.map(v => `<button class="chip" data-v="${esc(v)}">${dot?`<span class="dot" style="background:${color(v)}"></span>`:""}${esc(v)}</button>`).join("");
  el.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    const v = b.dataset.v;
    if (!v) set.clear(); else set.has(v) ? set.delete(v) : set.add(v);
    el.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.v ? set.has(c.dataset.v) : set.size === 0));
    render(true);
  });
}
chips(document.getElementById("cats"), cats, state.cats, true);
chips(document.getElementById("classes"), classes, state.classes, false);
document.getElementById("total").textContent = DATA.length;
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); render(true); });
document.getElementById("sort").addEventListener("change", e => { state.sort = e.target.value; render(false); });
document.getElementById("toggle").addEventListener("click", () => document.getElementById("side").classList.toggle("min"));

function filtered(){
  return DATA.filter(d =>
    (!state.cats.size || state.cats.has(d.cat)) &&
    (!state.classes.size || d.classes.some(c => state.classes.has(c))) &&
    (!state.q || (d.name+" "+d.addr+" "+d.reasons.join(" ")).toLowerCase().includes(state.q))
  ).sort((a,b) => state.sort === "name" ? a.name.localeCompare(b.name,"ko") : b.count - a.count || a.name.localeCompare(b.name,"ko"));
}

function render(fit){
  const list = filtered();
  document.getElementById("count").textContent = `${list.length}곳 표시 중`;
  document.getElementById("list").innerHTML = list.length ? list.map(d => `
    <div class="item" data-id="${d.id}">
      <div class="badge" style="background:${color(d.cat)}">${d.count}</div>
      <div><h3>${esc(d.name)}</h3>
      <div class="meta">${esc(d.cat)} · ${esc(d.classes.join(", "))}</div>
      <div class="meta">${esc(d.addr.replace(/^경기도 안산시 단원구 /,""))}</div></div>
    </div>`).join("") : `<div class="empty">조건에 맞는 맛집이 없어요</div>`;
  if (MAP.ready) MAP.show(list, fit);
}
document.getElementById("list").addEventListener("click", e => {
  const it = e.target.closest(".item"); if (!it) return;
  const d = DATA[+it.dataset.id];
  highlight(d.id);
  if (MAP.ready) MAP.focus(d);
});
function highlight(id){
  document.querySelectorAll(".item").forEach(i => i.classList.toggle("active", +i.dataset.id === id));
  const el = document.querySelector(`.item[data-id="${id}"]`);
  if (el) el.scrollIntoView({ block:"nearest", behavior:"smooth" });
}

function cardHtml(d){
  const reasons = d.reasons.map(r => esc(r).replace(/^\[(\d+반)\]/, "<b>$1</b>")).map(r => `<li>${r}</li>`).join("");
  const n = encodeURIComponent(d.name);
  return `<div class="card"><button class="x" aria-label="닫기">×</button><h3>${esc(d.name)}</h3>
    <div class="meta">${esc(d.cat)} · 추천 ${d.count}회 (${esc(d.classes.join(", "))})<br>${esc(d.addr)}</div>
    <ul>${reasons}</ul>
    <div class="links">
      <a class="kakao" target="_blank" rel="noopener" href="https://map.kakao.com/link/to/${n},${d.lat},${d.lng}">카카오 길찾기</a>
      <a target="_blank" rel="noopener" href="https://map.kakao.com/link/search/${n}">가게 정보</a>
    </div></div>`;
}

// ---------- 카카오 지도 ----------
const MAP = { ready:false };
function showNotice(html){ const n = document.getElementById("notice"); n.innerHTML = html; n.hidden = false; }

function initKakao(){
  const K = kakao.maps;
  const map = new K.Map(document.getElementById("map"), { center: new K.LatLng(37.3330, 126.8060), level: 5 });
  map.addControl(new K.ZoomControl(), K.ControlPosition.RIGHT);
  const pins = {}, card = new K.CustomOverlay({ clickable:true, yAnchor:1, zIndex:10 });
  let sel = null;

  DATA.forEach(d => {
    const size = 22 + Math.min(d.count,5)*4;
    const el = document.createElement("div");
    el.className = "pin";
    el.style.cssText = `width:${size}px;height:${size}px;background:${color(d.cat)}`;
    el.textContent = d.count > 1 ? d.count : "";
    el.title = d.name;
    el.addEventListener("click", () => { open(d); highlight(d.id); });
    pins[d.id] = { el, ov: new K.CustomOverlay({ position:new K.LatLng(d.plat,d.plng), content:el, clickable:true, zIndex:d.count }) };
  });

  function open(d){
    const wrap = document.createElement("div");
    wrap.innerHTML = cardHtml(d);
    wrap.querySelector(".x").addEventListener("click", close);
    card.setContent(wrap.firstElementChild);
    card.setPosition(new K.LatLng(d.plat, d.plng));
    card.setMap(map);
    if (sel) sel.classList.remove("sel");
    sel = pins[d.id].el; sel.classList.add("sel");
  }
  function close(){ card.setMap(null); if (sel) sel.classList.remove("sel"); sel = null; }
  K.event.addListener(map, "click", close);

  MAP.focus = d => { map.setLevel(3); map.panTo(new K.LatLng(d.plat, d.plng)); open(d); };
  MAP.show = (list, fit) => {
    const ids = new Set(list.map(d => d.id));
    DATA.forEach(d => pins[d.id].ov.setMap(ids.has(d.id) ? map : null));
    close();
    if (!fit || !list.length) return;
    // 멀리 떨어진 1~2곳 때문에 지도가 너무 축소되지 않도록 중앙값 근처 위주로 맞춤
    const med = a => { const s=[...a].sort((x,y)=>x-y); return s[Math.floor(s.length/2)]; };
    const cl = med(list.map(d=>d.lat)), cg = med(list.map(d=>d.lng));
    const near = list.filter(d => Math.abs(d.lat-cl) < 0.03 && Math.abs(d.lng-cg) < 0.04);
    const b = new K.LatLngBounds();
    (near.length ? near : list).forEach(d => b.extend(new K.LatLng(d.lat, d.lng)));
    if (near.length === 1 || list.length === 1) { map.setCenter(b.getCenter()); map.setLevel(3); }
    else map.setBounds(b, 40, 40, 40, 40);
  };
  MAP.ready = true;
  render(true);
}

render(false);
if (!KAKAO_APP_KEY || KAKAO_APP_KEY.startsWith("여기에")) {
  showNotice(`<div><b>카카오 지도 키가 아직 없어요.</b><br>index.html 위쪽의 <b>KAKAO_APP_KEY</b>에<br>카카오 JavaScript 키를 넣으면 지도가 나타나요.<br>왼쪽 목록과 검색은 지금도 쓸 수 있어요.</div>`);
} else {
  const s = document.createElement("script");
  s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(KAKAO_APP_KEY)}&autoload=false`;
  s.onload = () => {
    if (window.kakao && kakao.maps) kakao.maps.load(initKakao);
    else s.onerror();
  };
  s.onerror = () => showNotice(`<div><b>카카오 지도를 불러오지 못했어요.</b><br>① JavaScript 키가 맞는지<br>② 카카오 앱 설정 › 플랫폼 › Web 에<br><b>${esc(location.origin)}</b> 주소가 등록됐는지<br>③ 카카오맵 사용 설정이 켜져 있는지 확인해 주세요.</div>`);
  document.head.appendChild(s);
}
</script>
</body>
</html>
